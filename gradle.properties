org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.219
loader_version_range=[1,)

mod_id=polymorphic_ae2
mod_name=Polymorphic AE2
mod_license=LGPL-3.0-or-later
mod_version=1.0.0
mod_group_id=dev.aminoquiz.polymorphic_ae2

# Dependency floors
ae2_version_range=[19.2.17,)
# 1.21.1 Polymorph+ ships an alias [[mods]] entry with modId 'polymorph', so declaring
# 'polymorph' works with BOTH upstream Polymorph and Polymorph+. 26.1.2 has no alias
# (and no upstream build exists), so it must name polymorph_plus directly.
polymorph_mod_id=polymorph
polymorph_version_range=[1.1.0,)

# Local staging folder for built jars (machine specific, optional)
jar_output_dir=<local>/polymorph/new-jars
