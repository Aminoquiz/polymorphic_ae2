org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=26.1.2
minecraft_version_range=[26.1.2, 26.2)
neo_version=26.1.2.73
loader_version_range=[1,)

mod_id=polymorphic_ae2
mod_name=Polymorphic AE2
mod_license=LGPL-3.0-or-later
mod_version=1.0.0
mod_group_id=dev.aminoquiz.polymorphic_ae2

# Dependency floors
ae2_version_range=[26.1.10-beta,)
# 1.21.1 Polymorph+ ships an alias [[mods]] entry with modId 'polymorph', so declaring
# 'polymorph' works with BOTH upstream Polymorph and Polymorph+. 26.1.2 has no alias
# (and no upstream build exists), so it must name polymorph_plus directly.
polymorph_mod_id=polymorph_plus
polymorph_version_range=[1.2.0,)
