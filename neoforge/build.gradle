plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
            srcDir rootProject.file('src/main/java')
        }
    }
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = rootProject.file('run')
        }
        server {
            server()
            gameDirectory = rootProject.file('run/server')
            programArguments.add('--nogui')
        }
    }
}

dependencies {
    compileOnly fileTree(dir: rootProject.file('libs'), include: '*.jar')
    // Dev-run only: AE2, GuideME, Polymorph+ and the conflict tester, so runClient/runServer
    // actually boot with the mods this addon hooks into. Not shipped in the jar.
    runtimeOnly fileTree(dir: rootProject.file('run/mods'), include: '*.jar')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        ae2_version_range      : ae2_version_range,
        polymorph_mod_id       : polymorph_mod_id,
        polymorph_version_range: polymorph_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Convenience copy of the built jar into a local staging folder. Opt-in: set
// jar_output_dir in gradle.properties or on the command line. Absent, this does
// nothing, so the build works on a machine that is not the author's.
tasks.named('jar').configure {
    doLast {
        def outDir = project.findProperty('jar_output_dir')

        if (outDir) {
            copy {
                from archiveFile
                into file(outDir)
            }
        }
    }
}
